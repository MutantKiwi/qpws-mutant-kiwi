# fly launch --no-deploy --copy-config  (then edit app name) ; fly deploy
app = "qpws-mutant-kiwi"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/srv/data/parquet"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
